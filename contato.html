<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Contato - Barbearia Alura</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Fale com a Barbearia Alura e veja os dias e horários de atendimento.">
		<link rel="stylesheet" href="reset.css">
		<link rel="stylesheet" href="style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
	</head>
	<body>
		<header>
			<div class="caixa">
				<h1><a href="index.html"><img src="logo.png" alt="Barbearia Alura"></a></h1>
				<nav>
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="produtos.html">Produtos</a></li>
						<li><a href="contato.html" aria-current="page">Contato</a></li>
					</ul>
				</nav>
			</div>
		</header>
		<main id="contato">
			<form>
				<label for="nomesobrenome">Nome e sobrenome</label>
				<input type="text" id="nomesobrenome" name="nome" class="input-padrao" autocomplete="name" required> 
				<label for="email">Email</label>
				<input type="email" id="email" name="email" class="input-padrao" autocomplete="email" required placeholder="seuemail@dominio.com">
				<label for="telefone">Telefone</label>
				<input type="tel" id="telefone" name="telefone" class="input-padrao" autocomplete="tel" required placeholder="(xx)xxxxx-xxxx">
				<label for="mensagem">Mensagem</label>
				<textarea name="mensagem" id="mensagem" cols="70" rows="10" class="input-padrao" required></textarea>
				<fieldset>
						<legend>Como prefere nosso contato?</legend>
						<label for="radio-email"><input type="radio" name="contato" value="email" id="radio-email">
							Email</label>
						<label for="radio-telefone"><input type="radio" name="contato" value="telefone" id="radio-telefone">Telefone</label>
						<label for="radio-whatsapp"><input type="radio" name="contato" value="whatsapp" id="radio-whatsapp" checked>Whatsapp</label>
				</fieldset>
				<fieldset>
					<legend><label for="horario">Qual horário prefere ser atendido?</label></legend>
					<select id="horario" name="horario">
						<option>Manhã</option>
						<option>Tarde</option>
						<option>Noite</option>			
					</select>
				</fieldset>
				<label class="checkbox"> <input type="checkbox" name="novidades" checked> Gostaria de receber nossas novidades por email?</label>
				<input type="submit" value="Enviar formulário" class="enviar">
			</form>
			<table>
				<thead>
					<tr>
						<th>
							Dia
						</th>
						<th>
							Horário
						</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>
							Segunda
						</td>
						<td>
							8h ~ 20h
						</td>
					</tr>
					<tr>
						<td>
							Quarta
						</td>
						<td>
							8h ~ 20h
						</td>
					</tr>
					<tr>
						<td>
							Sexta
						</td>
						<td>
							8h ~ 20h
						</td>
					</tr>
		    	</tbody>
			</table>
		</main>
		<footer>
			<img src="logo-branco.png" alt="Barbearia Alura">
			<p class="copyright">&copy; Copyright Barbearia Alura - 2019</p>
		</footer>
	</body>
</html>
